name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check python
      - name: Testes (métricas de detecção)
        run: pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes (jogo, pós-processamento YOLO, rastreador e políticas)
        run: node --test "web/test/*.test.js"
      - name: Simulação rápida com detector oráculo
        run: node scripts/simular_oraculo.mjs --sementes 3 --duracao 20

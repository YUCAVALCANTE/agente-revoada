<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revoada · gerador de frames rotulados</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 16px; background: #f2f2f7; color: #1c1c1e; }
  canvas { border-radius: 12px; max-width: 100%; height: auto; display: block; }
  label { margin-right: 12px; }
</style>
</head>
<body>
<p>
  <label>Semente <input id="semente" type="number" value="1" style="width:90px"></label>
  <label>Cena <select id="cena"><option value="">aleatória (dia/entardecer)</option><option>dia</option><option>entardecer</option><option>noite</option></select></label>
  <label><input id="caixas" type="checkbox" checked> mostrar caixas reais</label>
  <button id="baixar">Baixar PNG + JSON</button>
</p>
<canvas id="tela" width="640" height="480"></canvas>
<pre id="saida"></pre>
<script type="module">
import { cenaAleatoria, caixasReais, LARGURA, ALTURA } from './src/jogo/mundo.js';
import { desenharMundo } from './src/jogo/render.js';

const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');

/** Desenha a cena da semente e devolve {imagem: dataURL PNG, caixas}. Usado pelo gerador (Playwright). */
function gerarFrame(semente, cena) {
  const mundo = cenaAleatoria(semente, { cena: cena || undefined });
  desenharMundo(ctx, mundo, { efeitos: false });
  return {
    semente, cena: mundo.cena, largura: LARGURA, altura: ALTURA,
    caixas: caixasReais(mundo).map(({ classe, caixa }) => ({ classe, caixa: caixa.map((v) => +v.toFixed(2)) })),
  };
}

function atualizar() {
  const r = gerarFrame(+semente.value, cena.value);
  if (caixas.checked) {
    for (const c of r.caixas) {
      const [x1, y1, x2, y2] = c.caixa;
      ctx.strokeStyle = c.classe === 'ave' ? '#34c759' : '#ff9f0a';
      ctx.lineWidth = 2;
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.font = '12px system-ui';
      ctx.fillText(c.classe, x1 + 2, y1 - 4);
    }
  }
  saida.textContent = JSON.stringify(r, null, 1);
}

window.gerarFrame = (s, c) => {
  const r = gerarFrame(s, c);
  return { ...r, imagem: tela.toDataURL('image/png') };
};
for (const id of ['semente', 'cena', 'caixas']) document.getElementById(id).addEventListener('input', atualizar);
baixar.onclick = () => {
  const r = window.gerarFrame(+semente.value, cena.value);
  const a = document.createElement('a');
  a.href = r.imagem; a.download = `revoada_${r.semente}.png`; a.click();
  const b = document.createElement('a');
  const { imagem, ...rotulo } = r;
  b.href = URL.createObjectURL(new Blob([JSON.stringify(rotulo)], { type: 'application/json' }));
  b.download = `revoada_${r.semente}.json`; b.click();
};
window.pronto = true;
atualizar();
</script>
</body>
</html>
